<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abismo da Montanha</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#e8e0c8;font:14px/1.3 "Courier New",monospace;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#crt{position:fixed;inset:0;pointer-events:none;display:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#fff;box-shadow:0 0 0 1px #000;pointer-events:none}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;text-shadow:2px 2px #000;pointer-events:none;line-height:1.4}
#bar{position:fixed;left:10px;top:calc(92px + env(safe-area-inset-top,0px));width:120px;height:6px;background:#222;border:1px solid #000;pointer-events:none}
#bar i{display:block;height:100%;width:100%;background:#7fbf5a}
#hot{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px}
.hs{width:58px;height:58px;background:#120e18cc;border:2px solid #6b5a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;text-align:center;cursor:pointer}
.hs.on{border-color:#c9a227;box-shadow:0 0 8px #c9a227}
.hs b{color:#c9a227;font-size:14px}
#prog{position:fixed;left:50%;top:56%;width:90px;height:6px;margin-left:-45px;background:#222;border:1px solid #000;display:none}
#prog i{display:block;height:100%;width:0;background:#c9a227}
#prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);text-shadow:2px 2px #000;display:none;pointer-events:none;white-space:nowrap}
#lbls{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);color:#f0d68a;text-shadow:1px 1px 0 #000,0 0 6px #000;font-size:12px;white-space:nowrap;display:none}
#menuBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:#0009;color:#e8e0c8;border:2px solid #c9a227;padding:6px 10px;font:inherit;display:none}
#dlg{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,92vw);background:#0c0a10ee;border-left:4px solid #8a7a50;padding:12px 14px;display:none;cursor:pointer;z-index:5}
#dlg b{color:#c9a227;display:block;margin-bottom:4px}
#fade{position:fixed;inset:0;background:#000;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:9}
.fb{position:fixed;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);color:#fff;font:bold 12px "Courier New",monospace;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;display:none}
#bMine{right:22px;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#bJump{right:110px;bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#bE{right:22px;bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#bDodge{right:110px;bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#bDrop{right:110px;bottom:calc(230px + env(safe-area-inset-bottom,0px))}
#bSpr{right:22px;bottom:calc(230px + env(safe-area-inset-bottom,0px))}
#joy{position:fixed;left:26px;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.3);display:none}
#joyk{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(201,162,39,.6)}
/* overlays: cada tipo tem visual próprio */
#ov{position:fixed;inset:0;display:none;z-index:7;align-items:center;justify-content:center}
#ovbox{max-width:92vw;max-height:90vh;overflow:auto;padding:18px;border:3px solid #c9a227;box-sizing:border-box}
#ov.start{background:radial-gradient(ellipse at center,#2a2236 0%,#07060a 75%)}
#ov.start #ovbox{width:340px;text-align:center;background:linear-gradient(#1c1626,#0b0910);box-shadow:0 0 40px #000 inset,0 0 0 6px #0b0910,0 0 0 8px #6b5a3a}
#ov.start h1{margin:0 0 4px;font:bold 26px Georgia,serif;color:#f0d68a;text-shadow:0 3px 0 #5a3a10,0 0 14px #c9a227;letter-spacing:2px}
#ov.start small{display:block;color:#8a7a50;margin-bottom:18px;letter-spacing:4px}
#ov.pause{background:rgba(0,0,0,.55);justify-content:flex-end}
#ov.pause #ovbox{width:300px;height:100%;max-height:100%;background:#15202a;border:none;border-left:3px solid #4a7aa0;padding-top:30px}
#ov.pause h2{color:#9fd0f0;text-transform:uppercase;letter-spacing:3px;font-size:16px}
#ov.shop{background:rgba(0,0,0,.6)}
#ov.shop #ovbox{width:420px;background:repeating-linear-gradient(90deg,#3a2a1c 0 22px,#33241a 22px 24px);border-color:#8a5a2a}
#ov.shop h2{color:#f0d68a;font-size:17px;text-align:center}
#ov.upg #ovbox{width:min(720px,92vw);background:#1e1a14;border-color:#c9a227}
#ov.upg h2{color:#f0d68a;text-align:center}
#ov button{display:block;width:100%;margin:6px 0;padding:9px;background:#2a2030;color:#e8e0c8;border:2px solid #6b5a3a;font:inherit;cursor:pointer;text-align:left;box-sizing:border-box}
#ov.start button{text-align:center;background:linear-gradient(#3a2e46,#221a2c);border-color:#8a7a50;font:bold 15px Georgia,serif;letter-spacing:2px}
#ov.start button:hover:not(:disabled){border-color:#f0d68a;color:#fff}
#ov.pause button{background:#1d2c38;border-color:#4a7aa0}
#ov.upg .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#ov.upg .grid button{margin:0;font-size:11px;text-align:center;min-height:52px}
#ov button:disabled{opacity:.35;cursor:default}
/* tema pixel: cores sólidas, sombras duras, nada de gradiente ou filtro,
   para rodar bem em navegadores e aparelhos antigos */
#hud{background:#0b0a0f;border:3px solid #6b5a3a;padding:6px 8px;box-shadow:3px 3px 0 #000;font-size:12px;line-height:1.5;text-shadow:none;max-width:70%}
#hud .k{color:#ffd24a;font-weight:bold}
#hud .z{color:#9fd0f0}
#hud .g{color:#ffd24a}
#hud .m{color:#cfc6a0}
#bar{top:auto;top:112px;left:10px;width:150px;height:10px;border:2px solid #000;background:#222}
#bar i{background:#5fa84a}
#hot{max-width:94vw;flex-wrap:wrap;justify-content:center}
.hs{position:relative;min-width:56px;height:56px;padding:3px 4px;box-sizing:border-box;margin:2px;background:#0b0a0f;border:3px solid #4a3f2a;box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:none;font-size:10px}
.hs.on{border-color:#ffd24a;box-shadow:0 0 0 2px #000}
.hs b{position:absolute;top:1px;left:4px;color:#ffd24a;font-size:10px}
.hs .sw{display:block;width:16px;height:16px;border:2px solid #000}
.hs small{color:#d8d0b8;font-size:9px;margin-top:2px}
.hs em{font-style:normal;color:#ffd24a;font-size:9px}
#prompt{background:#0b0a0f;border:2px solid #6b5a3a;padding:3px 8px;box-shadow:2px 2px 0 #000;text-shadow:none}
#dlg{background:#0b0a0f;border:3px solid #6b5a3a;box-shadow:4px 4px 0 #000;border-left-width:8px;font-size:13px;text-shadow:none}
#menuBtn{background:#0b0a0f;border:3px solid #6b5a3a;box-shadow:2px 2px 0 #000;font-size:12px}
.lbl{background:#0b0a0f;border:1px solid #000;padding:1px 4px;font-size:11px;text-shadow:none;color:#ffd24a}
.fb{border-radius:0;background:#0b0a0f;border:3px solid #6b5a3a;box-shadow:3px 3px 0 #000;font-size:11px}
#bCons{right:110px;bottom:calc(310px + env(safe-area-inset-bottom,0px));background:#2a1a10;border-color:#c77b30}
#ovbox{box-shadow:6px 6px 0 #000;border:4px solid #6b5a3a;background:#14101c}
#ov.start{background:#07060a}
#ov.start #ovbox{background:#14101c;border-color:#8a7a50}
#ov.start h1{text-shadow:3px 3px 0 #000}
#ov.start button{background:#2a2030;border-width:3px;box-shadow:3px 3px 0 #000;font-size:14px;letter-spacing:1px}
#ov.start button:hover:not(:disabled){background:#3d3050}
#ov.pause #ovbox{background:#101a22;border-color:#3a6a90}
#ov.pause button{background:#16242e;border-width:3px;box-shadow:2px 2px 0 #000}
#ov.shop #ovbox{background:#2a1e14;border-color:#8a5a2a}
#ov.shop button{background:#3a2a1c;border-width:3px;box-shadow:2px 2px 0 #000}
#ov.upg #ovbox{background:#1a1610}

#bar{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:10px}
.mc{color:#f0d68a}
.ores{margin-top:2px;font-size:11px}
.ore i{display:inline-block;width:10px;height:10px;border:1px solid #000;margin-right:4px;vertical-align:middle}
.hs .ic{width:28px;height:28px;image-rendering:pixelated;display:block}
#ov.pause{justify-content:center;align-items:center;background:rgba(0,0,0,.6)}
#ov.pause #ovbox{width:300px;height:auto;max-height:90vh;background:#e6d8b8;border:4px solid #6b5a3a;box-shadow:6px 6px 0 #000;color:#3a2a1a;padding:18px}
#ov.pause h2{color:#4a3520}
#ov.pause button{background:#d2bf96;color:#3a2a1a;border-color:#6b5a3a;box-shadow:2px 2px 0 #000}
#ov.pause button:disabled{opacity:.4}
#ov button{border-width:3px;border-radius:0;box-shadow:2px 2px 0 #000}
#hp{position:fixed;left:10px;bottom:calc(32px + env(safe-area-inset-bottom,0px));width:150px;height:12px;border:2px solid #000;background:#2a1010;pointer-events:none}
#hp i{display:block;height:100%;background:#c0302a}
#tt{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b0a0f;border:2px solid #c77b30;padding:2px 8px;color:#ffb640;display:none;pointer-events:none;z-index:4}
#dlg .ch{display:block;width:100%;margin:5px 0 0;padding:6px;background:#2a2030;color:#e8e0c8;border:2px solid #6b5a3a;font:inherit;text-align:left;cursor:pointer}
#dlg .ch:hover{background:#3d3050}
.rb{display:block;height:4px;background:#2a1010;border:1px solid #000;margin-top:2px}.rb u{display:block;height:100%;background:#c9a24a}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
const S={float:true,retro:true,crt:true,sens:1,fov:70,names:true,sprintHold:true,ui:1};

/* ---------- renderer ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(1);
const BG=0x000000;
const scene=new THREE.Scene();
scene.background=new THREE.Color(BG);
scene.fog=new THREE.Fog(BG,26,70);
const camera=new THREE.PerspectiveCamera(S.fov,1,.05,90);
camera.rotation.order='YXZ';
scene.add(camera);
scene.add(new THREE.AmbientLight(0x000000,0));
const torch=new THREE.PointLight(0xffb640,0,8,1.4);
torch.position.set(.3,-.2,-.3);
camera.add(torch);
function resize(){
  const k=S.retro?.4:1;
  renderer.setSize(Math.round(innerWidth*k),Math.round(innerHeight*k),false);
  camera.aspect=innerWidth/innerHeight;
  camera.fov=S.fov;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

/* ---------- cores e helpers de mundo ---------- */
const FLOOR=0x6a625a,WALL=0x57514b,STONE2=0x46423e,ROCK=0x3a3530,PILLAR=0x7a7068,
      GOLD=0xc9a227,WOOD=0x6b4a2e,RED=0x7a2020,BED=0x5a3a2a,SKIN=0xd8b89a,RAIL=0x4a443e,DOOR=0x3e2a1a;
const matCache={};
function MLM(o){return new THREE.MeshPhongMaterial(Object.assign({specular:0x000000,shininess:0},o));}
const FLM=new THREE.MeshBasicMaterial({color:0xffb030});
const mat=c=>matCache[c]||(matCache[c]=MLM({color:c}));
const UNIT=new THREE.BoxGeometry(1,1,1);
const boxes=[];
function box(x0,y0,z0,x1,y1,z1,c,solid=true){
  const m=new THREE.Mesh(UNIT,mat(c));
  m.scale.set(x1-x0,y1-y0,z1-z0);
  m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);
  scene.add(m);
  const b={x0,y0,z0,x1,y1,z1,m,solid};
  if(solid)boxes.push(b);
  return b;
}
const TORCH=[];
// tocha de parede: suporte preso na parede + chama amarelada cintilante
function tw(x,y,z,d=9){
  const l=new THREE.PointLight(0xffb84a,2.6,Math.max(d,24),1.0);l.position.set(x,y+.2,z);scene.add(l);
  box(x-.06,y-.25,z-.06,x+.06,y+.1,z+.06,0x4a3a2a,false);
  box(x-.07,y+.1,z-.07,x+.07,y+.3,z+.07,0xffb030,false).m.material=FLM;
  TORCH.push({l,base:2.6,ph:Math.random()*6});
}
// tocha longa de chão: haste até o piso + chama no topo
function tf(x,y,z,d=9){
  const l=new THREE.PointLight(0xffb84a,2.6,Math.max(d,24),1.0);l.position.set(x,y+1.8,z);scene.add(l);
  box(x-.07,y-1.2,z-.07,x+.07,y+1.8,z+.07,0x3a2a1a,false);
  box(x-.1,y+1.8,z-.1,x+.1,y+2.05,z+.1,0xffb030,false).m.material=FLM;
  TORCH.push({l,base:2.6,ph:Math.random()*6});
}

/* ---------- labels, interação e NPCs ---------- */
const interactables=[],lbls=[];
function label(x,y,z,text){
  const el=document.createElement('div');el.className='lbl';el.textContent=text;
  $('lbls').appendChild(el);lbls.push({x,y,z,el});
}
function inter(x,y,z,r,name,lb,act){
  interactables.push({x,y,z,r,name,act});
  if(lb)label(x,y+1.7,z,lb);
}

function genQ(n){const r=()=>1+Math.floor(Math.random()*3)+Math.floor(day/3),pk=a=>a[Math.floor(Math.random()*a.length)];

function npcTalk(name,fn){
  const pre=[];

    if(o.type==='talk'){o.st='done';gold+=o.rw;rp(g,8);sfx('buy');pre.push([name,'Ah, '+g+' mandou você? Diga que está tudo certo. Tome, pelo trabalho: '+o.rw+' de ouro.']);}
    else if(o.type==='courier'&&o.stage===0){o.stage=1;sfx('buy');pre.push([name,'Hm. Leve minha resposta de volta para '+g+'. Ele vai saber.']);}}
  const o=QD[name];

    if(o.type==='courier'&&o.stage===1){o.st='done';gold+=o.rw;rp(name,10);sfx('buy');talk(pre.concat([[name,'Ele respondeu? Ótimo. Aqui, '+o.rw+' de ouro.']]));return;}
    if(o.type==='bring'&&Object.keys(o.need).every(k=>inv[k]>=o.need[k])){for(const k in o.need)inv[k]-=o.need[k];o.st='done';gold+=o.rw;rp(name,8);sfx('buy');talk(pre.concat([[name,'Entregue. Aqui, '+o.rw+' de ouro. Não vou esquecer.']]));return;}
    const st=o.type==='bring'?'Ainda falta: '+needTxt(o.need)+'.':o.type==='talk'?'Já falou com '+o.tgt+'?':(o.stage===0?'Leve o embrulho a '+o.tgt+'.':'Volte com a resposta de '+o.tgt+'.');

  if(QN.includes(name)&&qAvail(name)){
    const q0=genQ(name),rw=15+day*5,desc=q0.type==='bring'?'Preciso de '+needTxt(q0.need)+' pra hoje.':q0.type==='talk'?'Vá falar com '+q0.tgt+' por mim.':'Leve este embrulho para '+q0.tgt+' e volte com a resposta.';
    talk(pre.concat([[name,desc+' Pago '+rw+' de ouro. Aceita?',[
      {t:'Aceito',f:()=>{QD[name]=Object.assign({day,st:'active',rw},q0);refreshNL();},say:'Combinado.'},
      {t:'Recuso',f:()=>{QD[name]={day,st:'refused'};rp(name,-4);},say:'Entendo. Cada um carrega o que aguenta.'}]]]));return;}
  const [ls,end]=fn(),b=REP[name]<25?0:REP[name]<50?1:2,BGL=[['Fale logo. Tenho trabalho.','Some daqui.'],['Hm. Você de novo.','O de sempre?'],['Que bom te ver, príncipe.','Cuide-se lá embaixo.']],r=Math.random();

  talk(pre.concat(ls),end);
}

const FK=[['Dano','dmg',9],['Pegada','cdM',0],['Golpe','cdA',9],['Defesa','def',9],['Mercado','sell',0],['Esquiva','dodge',8],['Caçador','lootC',8]],RM=['I','II','III','IV','V','VI','VII'];
function treeNodes(k){const a=[];for(let i=0;i<20;i++){
  if(k==='casa')a.push({t:CN[i%5]+' '+RM[Math.floor(i/5)],key:CK[i%5],gold:Math.round(25*Math.pow(i+1,1.5))});
  else{const [n,key,m]=FK[i%7];a.push({t:n+' '+RM[Math.floor(i/7)],key,gold:Math.round(30*Math.pow(i+1,1.4)),mat:m?[m,2+Math.floor(i/2)]:[1+Math.min(3,Math.floor(i/5)),3+i]});}}
  return a;}
function openTree(k){
  const N=treeNodes(k),G=[[0]];for(let i=1;i<20;){G.push([i,i+1].filter(x=>x<20));i+=2;if(i<20){G.push([i]);i++;}}
  const B=treeB[k],mul=k==='casa'?1:pm('Dûrak',true);
  const rows=N.map((n,i)=>{const gi=G.findIndex(g=>g.includes(i)),open=gi===0||G[gi-1].some(x=>B.includes(x)),done=B.includes(i),c=Math.round(n.gold*mul);
    const ok=open&&!done&&gold>=c&&(!n.mat||inv[n.mat[0]]>=n.mat[1]);
    return {t:`${n.t}${done?' ✔':''}<br><small>${c} ouro${n.mat?' + '+n.mat[1]+' '+MATN[n.mat[0]]:''}</small>`,dis:!ok,f:()=>{gold-=c;if(n.mat)inv[n.mat[0]]-=n.mat[1];B.push(i);if(k==='casa')U[n.key]++;else X[n.key]++;saveGame();openTree(k);}};});

function rebuildMine(){

    const b=mg[mi(i,j,k)];if(!b)continue;
    const base=BLK[b].c;
    const kk=.85+(((i*73856093)^(j*19349663)^(k*83492791))>>>0)%1000/1000*.3;
    for(const [nx,ny,nz,sh] of FACES){
      if(vs(i+nx,j+ny,k+nz))continue;
      let ux,uy,uz,vx,vy,vz;
      if(nx){ux=0;uy=1;uz=0;vx=0;vy=0;vz=1;}
      else if(ny){ux=1;uy=0;uz=0;vx=0;vy=0;vz=1;}
      else{ux=1;uy=0;uz=0;vx=0;vy=1;vz=0;}
      const cx=i+.5+nx*.5,cy=j+.5+ny*.5,cz=k+.5+nz*.5;

      const r=qz(base[0]*kk*sh),g=qz(base[1]*kk*sh),bl=qz(base[2]*kk*sh);
      const flip=nx?nx<0:ny?ny>0:nz<0;
      for(const t of (flip?[0,2,1,0,3,2]:[0,1,2,0,2,3])){P_.push(...q4[t]);N_.push(nx,ny,nz);C_.push(r,g,bl);}

const RAD=.28,HGT=1.7,STEP=.55;
function blocked(x,y,z){
  const x0=x-RAD,x1=x+RAD,z0=z-RAD,z1=z+RAD,y0=y+STEP,y1=y+HGT;
  for(const b of boxes)
    if(b.solid&&b.x0<x1&&b.x1>x0&&b.y0<y1&&b.y1>y0&&b.z0<z1&&b.z1>z0)return true;
  const i0=Math.floor(x0-MX),i1=Math.floor(x1-MX-1e-6),j0=Math.floor(y0-MY),j1=Math.floor(y1-MY-1e-6),k0=Math.floor(z0-MZ),k1=Math.floor(z1-MZ-1e-6);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++)for(let k=k0;k<=k1;k++)if(vs(i,j,k))return true;
  return false;
}
function groundY(x,y,z){
  let best=-Infinity;const lim=y+STEP;
  const x0=x-RAD,x1=x+RAD,z0=z-RAD,z1=z+RAD;
  for(const b of boxes)
    if(b.solid&&b.x0<x1&&b.x1>x0&&b.z0<z1&&b.z1>z0&&b.y1<=lim&&b.y1>best)best=b.y1;
  const i0=Math.floor(x0-MX),i1=Math.floor(x1-MX-1e-6),k0=Math.floor(z0-MZ),k1=Math.floor(z1-MZ-1e-6);
  for(let i=i0;i<=i1;i++)for(let k=k0;k<=k1;k++)
    for(let j=MH-1;j>=0;j--){
      const top=MY+j+1;if(top>lim)continue;
      if(vs(i,j,k)){if(top>best)best=top;break;}
    }
  return best;
}
function pick(){

}

// maior tier comprado/possuído de um grupo (-1 se nenhum)
function ownedTier(g){let t=-1;for(const h of hot)if(h&&!ITEMS[h.id].cons&&ITEMS[h.id].g===g)t=Math.max(t,ITEMS[h.id].t);return t;}
// capacidade de minérios: 8 slots, +2 por nível de Força
function capOre(){return 8+2*U.Força;}
// item some da loja se já possuo um de tier igual ou maior
function canShow(id){const it=ITEMS[id];if(it.q)return false;if(it.cons)return true;return ownedTier(it.g)<it.t;}
// coloca o item na barra: evolução substitui o slot do grupo; consumível empilha; novo item ocupa o próximo slot livre
function obtain(id){
  const it=ITEMS[id];
  if(it.cons){
    const e=hot.find(h=>h&&h.id===id);
    if(e){if(e.n>=it.max)return false;e.n++;hudHot();return true;}
  }else{
    const i=hot.findIndex(h=>h&&!ITEMS[h.id].cons&&ITEMS[h.id].g===it.g);
    if(i>=0){hot[i]={id,n:1};hudHot();return true;}
  }
  let e=hot.indexOf(null);
  if(e<0){hot.push(null);e=hot.length-1;}
  hot[e]={id,n:1};hudHot();return true;
}
function buyItem(id){
  const it=ITEMS[id];
  if(gold<PR(id)){talk([['','Falta ouro.']]);return;}
  if(it.mat)for(const k in it.mat)if(inv[k]<it.mat[k]){talk([['','Faltam materiais: '+MATN[k]+' x'+it.mat[k]+'.']]);return;}
  if(!obtain(id)){talk([['','Não cabe mais. Limite deste item atingido.']]);return;}
  if(it.mat)for(const k in it.mat)inv[k]-=it.mat[k];
  sfx('buy');gold-=PR(id);saveGame();openShop(curShop);
}

let mt=null,mtT=0,last=performance.now();
let cProg=0,consLock=false,btnCons=false;
function step(dt){
  const busy=!!dlg;
  let f=busy?0:(keys.KeyW?1:0)-(keys.KeyS?1:0)-jy;
  let s=busy?0:(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx;
  const L=Math.hypot(f,s),k=L>1?1/L:1;
  f*=k;s*=k;
  const moving=Math.hypot(f,s)>.1;
  const wantSprint=!busy&&moving&&P.st>0&&(keys.KeyQ||btnSpr);
  const spd=4.2*(1+.06*U.Passos)*(wantSprint?1.7:1)*(dashT>0?2.6:1);
  if(wantSprint)P.st=Math.max(0,P.st-.3*dt/(1+.2*U.Resistência));
  else P.st=Math.min(1,P.st+.2*(1+.25*U.Fôlego)*dt);
  const sn=Math.sin(P.yaw),cs=Math.cos(P.yaw),sp=spd*dt;
  const dx=(-sn*f+cs*s)*sp,dz=(-cs*f-sn*s)*sp;
  if(!blocked(P.x+dx,P.y,P.z))P.x+=dx;
  if(!blocked(P.x,P.y,P.z+dz))P.z+=dz;

  if(jumpReq&&P.ground&&!busy)P.vy=7.4;
  jumpReq=false;
  P.vy=Math.max(-30,P.vy-24*dt);
  const dy=P.vy*dt;
  if(dy>0){
    if(blocked(P.x,P.y+dy,P.z))P.vy=0;else P.y+=dy;
    P.ground=false;
  }else{
    const g=groundY(P.x,P.y,P.z),ny=P.y+dy;
    if(ny<=g){P.y=g;P.vy=0;P.ground=true;}
    else{P.y=ny;P.ground=false;}
  }
  if(P.y<-40)spawnHome();
  updSpiders(dt);
  if(mineLvl>1&&P.y>-9){mineLvl=1;genMine(((Math.random()*1e9)|0)+1);rebuildMine();}
  if(P.y>-12&&P.hp<maxHP())P.hp=Math.min(maxHP(),P.hp+dt*.8);
  if(torchT>0){torchT-=dt;if(torchT<=0){torchT=0;consumeTorch();}}
  bagSync();trackInv();updParts(dt);atkCd-=dt;invT-=dt;dashT-=dt;dodgeCd-=dt;if(!dlg)dayT=Math.max(0,dayT-dt);if(beerT>0){beerT-=dt;P.st=1;}
tens=spiders.some(x=>x.aggro)?1.2:(P.y<-12?.7:.25);
  if(moving&&P.ground){stT-=dt*(wantSprint?1.6:1);if(stT<=0){stT=.42;sfx('step');}}

  const tgt=busy?null:pick();
  const selCons=selIsCons();
  const holdCons=!busy&&selCons&&(mouseMine||btnCons);
  if(!holdCons){cProg=0;consLock=false;}
  else if(!consLock){
    cProg+=dt;
    $('prog').style.display='block';
    $('prog').querySelector('i').style.width=Math.min(100,cProg/.8*100)+'%';
    if(cProg>=.8){cProg=0;consLock=true;useFood();}
  }
  const tool=(sel>=0&&hot[sel]&&ITEMS[hot[sel].id].g==='pick')?hot[sel].id:null;
  const click=!busy&&!selCons&&(mouseMine||touchMine||btnMine);
  const spT=click?aimSpider():null;
  if(spT&&atkCd<=0){atkCd=.55*(1-.04*X.cdA);const wid=(sel>=0&&hot[sel])?hot[sel].id:'';const dm=({espada:2,espadaFe:3,espadaPr:4,espadaMi:5})[wid]||1;spT.hp-=dm+X.dmg;burst(spT.x,-14+.6*MT[spT.type].sc,spT.z,0xb01818,12);spT.aggro=true;sfx('swing');if(spT.hp<=0)killSpider(spT);}
  const mining=click&&!spT;
  const mult=tool?TOOLM[tool]*(1+.15*U.Força)*(1+.08*X.cdM):0;
  const tot=ores();
  if(mining&&tgt&&mult>0&&tot<capOre()&&PTIER[tool]>=(BLK[mg[mi(tgt.i,tgt.j,tgt.k)]].req||0)&&tgt.j>0&&tgt.i>0&&tgt.i<MW-1&&tgt.k>0&&tgt.k<MD-1){
    const id=mg[mi(tgt.i,tgt.j,tgt.k)];
    if(!mt||mt.i!==tgt.i||mt.j!==tgt.j||mt.k!==tgt.k){mt=tgt;mtT=0;}
    mtT+=dt;sndT-=dt;if(sndT<=0){sndT=.28;sfx('hit');}
    const need=BLK[id].h/mult;
    $('prog').style.display='block';
    $('prog').querySelector('i').style.width=Math.min(100,mtT/need*100)+'%';
    if(mtT>=need){
      inv[id]++;sfx(id>=3?'pick':'break');
      {const ci=mi(tgt.i,tgt.j,tgt.k);mg[ci]=0;mineDiff.push([ci,0]);}
      mt=null;mtT=0;rebuildMine();
      $('prog').style.display='none';
    }
  }else{mt=null;mtT=0;if(!(holdCons&&!consLock))$('prog').style.display='none';}
  if(tgt){hl.visible=true;hl.position.set(MX+tgt.i+.5,MY+tgt.j+.5,MZ+tgt.k+.5);}
  else hl.visible=false;

  camera.position.set(P.x,P.y+1.6,P.z);
  camera.rotation.set(P.pitch,P.yaw,0);
  const press=!busy&&(mouseMine||touchMine||btnMine);if(press&&swingT<=0)swingT=.4;swingT-=dt;updateHand(swingT>0);
  const lid=(sel>=0&&hot[sel])?hot[sel].id:null;
  heldLight=lid==='lanterna'?'lanterna':(torchT>0?'tocha':null);
  if(heldLight==='lanterna'){torch.color.setHex(0xf4f8ff);torch.intensity=2.6*(1+.3*U.Lanterna);torch.distance=22+2*U.Lanterna;}
  else if(heldLight==='tocha'){torch.color.setHex(0xffb640);torch.distance=16;}
  else torch.intensity=0;
}

    const ok=S.names&&v.z<1&&d<18&&gameStarted&&!menuOn;
    L.el.style.display=ok?'block':'none';
    if(ok){L.el.style.left=((v.x+1)/2*innerWidth)+'px';L.el.style.top=((-v.y+1)/2*innerHeight)+'px';}
  }
}
function loop(now){
  const dt=Math.min((now-last)/1000,.05);
  last=now;
  if(gameStarted&&!menuOn){
    step(dt);
    hud();
    const it=nearest(),p=$('prompt');
    if(it&&!dlg){p.style.display='block';p.textContent=(isTouch?'toque em E · ':'E · ')+it.name;}
    else p.style.display='none';
  }
  updLabels();
  updateLights(now/1000);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function syncBtns(){
  const on=isTouch&&gameStarted&&!menuOn;
  bMine.style.display=bJump.style.display=(on&&S.float)?'block':'none';
  bSpr.style.display=(on&&S.float)?'block':'none';
  bCons.style.display=(on&&S.float&&selIsCons())?'block':'none';
  bE.style.display=on?'block':'none';
  $('bDodge').style.display=(on&&S.float)?'block':'none';
  dropVis();
  $('joy').style.display=on?'block':'none';
  $('crt').style.display=S.crt?'block':'none';
  $('cross').style.display=(isTouch||!gameStarted)?'none':'block';
  $('hot').style.display=gameStarted&&!menuOn?'flex':'none';
  $('hud').style.display=gameStarted?'block':'none';
  $('bar').style.display=gameStarted?'block':'none';
  $('hp').style.display=gameStarted?'block':'none';
}
addEventListener('keydown',e=>{if(e.code==='Escape'&&!gameStarted)e.preventDefault();});

/* ---------- ícones pixel, lista de minérios e luzes ---------- */
const ICONS={};
function drawIcon(id,x){
  const it=ITEMS[id],t=it.t||0;
  const r=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h);};
  const BR='#6b4a2e';
  if(it.g==='pick'){const M=['#9aa0aa','#c0704f','#dfe8f0','#58d6c6'][t];r(3,2,1,6,BR);r(1,1,6,1,M);r(1,2,1,1,M);r(6,2,1,1,M);}
  else if(it.g==='espada'){r(4,0,1,6,t?'#eef4fa':'#b8c0c8');r(2,6,5,1,'#c9a227');r(4,7,1,1,BR);}
  else if(id==='tocha'){r(3,3,2,5,BR);r(3,0,2,3,'#ffb030');r(3,1,2,1,'#ffe070');}
  else if(id==='lanterna'){r(2,2,4,5,'#3a3a40');r(3,3,2,3,'#ffffff');r(3,1,2,1,'#c9a227');}
  else if(it.g==='arm'){r(1,1,6,6,['#7a5030','#9a6050','#c8d4e0','#58d6c6'][t]);r(3,1,2,2,'#000');}
  else if(id==='pocao'){r(2,2,4,5,'#c02030');r(3,1,2,1,'#ddd');}
  else if(id==='corda'){r(1,3,6,2,'#b09050');r(2,2,1,1,'#b09050');}
  else if(id==='pao'){r(1,3,6,3,'#d9a050');r(2,2,4,1,'#c98a3a');}
  else if(id==='cerveja'){r(2,2,4,5,'#c99a40');r(2,1,4,1,'#f5f0e0');}
}
function iconOf(id){
  if(ICONS[id])return ICONS[id];
  const c=document.createElement('canvas');c.width=8;c.height=8;
  drawIcon(id,c.getContext('2d'));
  ICONS[id]=c.toDataURL();
  return ICONS[id];
}
const ORE_COL=['','#6b6670','#b0634a','#c8d4e0','#58d6c6','#c07a3a','#e8c030','#d02848','#c8c0a0','#7a5030'];
function oreRow(){
  const parts=[];
  for(let i=1;i<=9;i++)if(inv[i]>0)parts.push(`<span class="ore"><i style="background:${ORE_COL[i]}"></i>${MATN[i]} x ${inv[i]}</span>`);
  return parts.length?`<div class="ores">${parts.join(' ')}</div>`:'';
}
let heldLight=null;
function updateLights(t){
  for(const T of TORCH)T.l.intensity=T.base*(0.78+0.22*Math.sin(t*11+T.ph)*Math.sin(t*4.3+T.ph*1.7));
  if(heldLight==='tocha')torch.intensity=2.3*(0.65+0.35*Math.sin(t*13)*Math.sin(t*6.1+1));
  const arr=TORCH.map(T=>{const p=T.l.position,dx=p.x-P.x,dy=p.y-P.y,dz=p.z-P.z;return {T,d:dx*dx+dy*dy+dz*dz};}).sort((a,b)=>a.d-b.d);
  for(let i=0;i<POOL.length;i++){const e=arr[i],l=POOL[i];if(e&&e.d<1100){l.position.copy(e.T.l.position);l.intensity=e.T.l.intensity;l.distance=Math.min(e.T.l.distance,24);}else l.intensity=0;}
}

/* ---------- item na mão ---------- */
const hand=new THREE.Group();
hand.position.set(.32,-.32,-.55);
camera.add(hand);
const handModels={};
function buildHand(){
  const bm=(g,w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);g.add(m);};
  for(const id of Object.keys(ITEMS)){
    const it=ITEMS[id];if(it.g==='arm')continue;
    const g=new THREE.Group(),t=it.t;
    if(it.g==='pick'){
      bm(g,.03,.3,.03,0x6b4a2e,0,-.12,0);
      bm(g,.04,.04,.16,[0x6a6a6a,0xb0634a,0xc8d4e0,0x58d6c6][t],0,.02,0);
    }else if(it.g==='espada'){
      bm(g,.02,.03,.03,0x6b4a2e,0,-.1,0);
      bm(g,.06,.02,.02,GOLD,0,0,0);
      bm(g,.02,.35,.01,[0xaaaaaa,0xc8d4e0,0xdde8f0,0x58d6c6][t],0,.18,0);
    }else if(it.cons){
      if(id==='cerveja'){bm(g,.08,.11,.08,0xd09a28,0,0,0);bm(g,.085,.025,.085,0xf4f0e0,0,.07,0);bm(g,.03,.07,.03,0xd09a28,.06,0,0);}
      else if(id==='tocha'){bm(g,.035,.3,.035,0x6b4a2e,0,-.08,0);const fm=new THREE.Mesh(new THREE.BoxGeometry(.07,.09,.07),new THREE.MeshBasicMaterial({color:0x3a2a1a}));fm.position.set(0,.1,0);g.add(fm);g.userData.flame=fm;}
      else if(id==='pao'){bm(g,.16,.06,.07,0xc88a40,0,0,0);bm(g,.12,.02,.05,0xe0b060,0,.035,0);}
      else if(id==='corda'){bm(g,.1,.1,.03,0xb09050,0,0,0);bm(g,.06,.06,.035,0x6a5a30,0,0,0);}
      else bm(g,.06,.06,.06,0xcccccc,0,0,0);
    }else{
      bm(g,.03,.25,.03,0x6b4a2e,0,-.1,0);
      bm(g,.06,.06,.06,t?0x2a2a2a:0xffa050,0,.04,0);
    }
    g.visible=false;hand.add(g);handModels[id]=g;
  }
}
function updateHand(swing){
  for(const id in handModels)handModels[id].visible=false;
  if(sel>=0&&hot[sel]&&handModels[hot[sel].id]){
    const g=handModels[hot[sel].id];
    g.visible=true;
    if(g.userData.flame){const lit=torchT>0;g.userData.flame.material.color.setHex(lit?0xffb030:0x3a2a1a);const k=lit?1+.25*Math.sin(performance.now()/70):1;g.userData.flame.scale.set(k,lit?1.3*k:1,k);}
    g.rotation.x=swing?-Math.sin(Math.PI*Math.max(0,Math.min(1,1-swingT/.4)))*1.1:0;
  }
}

/* ---------- áudio: efeitos e trilha tensa (WebAudio, sem arquivos) ---------- */
let AC=null,mast=null,mus=null,musicOn=true,sfxOn=true;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();mast=AC.createGain();mast.gain.value=.8;mast.connect(AC.destination);startMusic();}catch(e){AC=null;}
}
addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
function tone(f,d,type,v,slide){
  if(!AC||!sfxOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mast);o.start();o.stop(t+d);
}
function noise(d,v,fq){
  if(!AC||!sfxOn)return;const n=Math.floor(AC.sampleRate*d),buf=AC.createBuffer(1,n,AC.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;fl.type='bandpass';fl.frequency.value=fq;
  g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);s.connect(fl);fl.connect(g);g.connect(mast);s.start();
}
function sfx(n){
  if(!AC)return;
  if(n==='hit'){noise(.08,.25,900);tone(160,.08,'square',.06,.5);}
  else if(n==='break'){noise(.2,.35,500);tone(90,.2,'sawtooth',.1,.4);}
  else if(n==='pick'){noise(.15,.3,800);tone(880,.1,'square',.06);tone(1320,.14,'square',.05);}
  else if(n==='buy'){tone(660,.08,'square',.07);setTimeout(()=>tone(990,.12,'square',.07),80);}
  else if(n==='hurt'){tone(140,.3,'sawtooth',.2,.4);noise(.2,.3,400);}
  else if(n==='swing'){noise(.1,.18,2000);}
  else if(n==='kill'){tone(300,.25,'square',.12,.3);noise(.25,.3,600);}
  else if(n==='desc'){tone(90,1.2,'sawtooth',.18,.3);}
  else if(n==='light'){noise(.3,.25,1500);tone(200,.3,'triangle',.1,2);}
  else if(n==='out'){tone(200,.5,'triangle',.1,.4);}
  else if(n==='step'){noise(.05,.06,300);}
}
function thump(v){
  if(!AC||!mus||v<=0)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(38,t+.2);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
  o.connect(g);g.connect(mus);o.start();o.stop(t+.25);
}
function startMusic(){
  mus=AC.createGain();mus.gain.value=musicOn?.5:0;mus.connect(mast);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=200;lp.connect(mus);
  [[55,'sawtooth'],[58.3,'sawtooth'],[27.5,'sine']].forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(lp);o.start();});
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=90;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const dl=AC.createDelay(1);dl.delayTime.value=.45;const fb=AC.createGain();fb.gain.value=.5;dl.connect(fb);fb.connect(dl);dl.connect(mus);
  const NOTES=[220,233.1,311.1,329.6,415.3,466.2];
  const ping=()=>{if(musicOn){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=NOTES[Math.floor(Math.random()*NOTES.length)];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+4);o.connect(g);g.connect(dl);g.connect(mus);o.start();o.stop(t+4.2);}
    setTimeout(ping,3000+Math.random()*6000);};ping();
  const beat=()=>{if(musicOn&&gameStarted&&!menuOn){thump(.2*tens);setTimeout(()=>thump(.13*tens),230);}setTimeout(beat,1100-tens*250);};beat();
}

loadOpts();resize();applyUI();$('crt').style.display=S.crt?'block':'none';
buildWorld();
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;
torch.castShadow=true;torch.shadow.mapSize.set(512,512);torch.shadow.camera.near=.15;torch.shadow.camera.far=40;torch.shadow.bias=-.004;
genMine(1);rebuildMine();
const POOL=[];for(let i=0;i<8;i++){const l=new THREE.PointLight(0xffb84a,0,24,1.0);scene.add(l);POOL.push(l);}
for(const T of TORCH)scene.remove(T.l);
scene.traverse(o=>{if(!o.isMesh)return;let p=o,cam=false;while(p){if(p===camera)cam=true;p=p.parent;}if(!cam){o.castShadow=true;o.receiveShadow=true;}});
mineMesh.castShadow=false;mineMesh.receiveShadow=false;
spawnHome();
buildHand();
hudHot();
syncBtns();
showStart();
requestAnimationFrame(loop);
